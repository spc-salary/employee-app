name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Android build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ant \
          autoconf \
          automake \
          autopoint \
          ccache \
          cmake \
          g++ \
          gcc \
          git \
          lbzip2 \
          libffi-dev \
          libltdl-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libssl-dev \
          libtinfo5 \
          libtool \
          make \
          patch \
          pkg-config \
          python3-dev \
          python3-pip \
          python3-venv \
          sudo \
          unzip \
          wget \
          zip \
          zlib1g-dev

    - name: Install Buildozer and Cython
      run: |
        python -m pip install --upgrade pip
        python -m pip install --user "buildozer==1.6.0" "Cython==0.29.34"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build with Buildozer
      run: |
        buildozer -v android debug

    - name: Verify APK output
      run: |
        apk="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
        if [ -z "$apk" ]; then
          echo "Buildozer completed without producing an APK in bin/."
          exit 1
        fi
        echo "APK created: $apk"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        if-no-files-found: error
